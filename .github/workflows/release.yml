name: Release

# A v* tag builds both packages, writes SHA256SUMS and creates a draft release.
# A human reviews the draft and publishes it (CI-8 to CI-12, CI-16). Asset names follow
# RPGModder.Core/Updates/ReleaseAssets.cs: RPGModder-<version>-<runtime>.<ext> plus SHA256SUMS.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  version:
    name: Check tag against csproj version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare tag and version
        id: read
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' RPGModder.UI/RPGModder.UI.csproj | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::RPGModder.UI.csproj has no <Version>."
            exit 1
          fi
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not equal v$version from RPGModder.UI.csproj."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows package
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore RPGModder.sln --locked-mode -p:Configuration=Release

      - name: Build
        run: dotnet build RPGModder.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test RPGModder.sln --configuration Release --no-build

      - name: Publish win-x64
        run: |
          $name = "RPGModder-$env:VERSION-win-x64"
          dotnet publish RPGModder.UI/RPGModder.UI.csproj --configuration Release --runtime win-x64 --self-contained true `
            -p:RestoreLockedMode=true --output "artifacts/win-x64/$name"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item LICENSE "artifacts/win-x64/$name/"

      - name: Smoke-run the published binary
        run: |
          $exe = "artifacts/win-x64/RPGModder-$env:VERSION-win-x64/RPGModder.exe"
          $process = Start-Process -FilePath $exe -ArgumentList '--platform-diagnostics' -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput diagnostics.txt -RedirectStandardError diagnostics-error.txt
          Get-Content diagnostics.txt
          if ($process.ExitCode -ne 0) { throw "--platform-diagnostics exited with $($process.ExitCode)." }
          if (-not (Select-String -Path diagnostics.txt -Pattern '^OS=' -Quiet)) { throw "--platform-diagnostics wrote no report." }

      - name: Zip
        run: |
          $name = "RPGModder-$env:VERSION-win-x64"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            (Resolve-Path "artifacts/win-x64/$name").Path,
            (Join-Path (Resolve-Path artifacts).Path "$name.zip"),
            [System.IO.Compression.CompressionLevel]::Optimal,
            $true)

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-windows
          path: artifacts/RPGModder-${{ needs.version.outputs.version }}-win-x64.zip
          retention-days: 7
          if-no-files-found: error

  linux:
    name: Linux packages
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Install packaging and self-test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xdg-utils zip

      - name: Restore (locked)
        run: dotnet restore RPGModder.sln --locked-mode -p:Configuration=Release

      - name: Build
        run: dotnet build RPGModder.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test RPGModder.sln --configuration Release --no-build

      - name: Publish linux-x64
        run: |
          dotnet publish RPGModder.UI/RPGModder.UI.csproj --configuration Release --runtime linux-x64 --self-contained true \
            -p:RestoreLockedMode=true --output "artifacts/linux-x64/RPGModder-$VERSION-linux-x64"

      - name: Smoke-run the published binary
        run: |
          chmod u+x "artifacts/linux-x64/RPGModder-$VERSION-linux-x64/RPGModder"
          "artifacts/linux-x64/RPGModder-$VERSION-linux-x64/RPGModder" --platform-self-test

      - name: Package tar.gz and zip
        run: PREBUILT_DIR="artifacts/linux-x64/RPGModder-$VERSION-linux-x64" sh packaging/linux/package.sh "$VERSION"

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-linux
          path: |
            artifacts/RPGModder-${{ needs.version.outputs.version }}-linux-x64.tar.gz
            artifacts/RPGModder-${{ needs.version.outputs.version }}-linux-x64.zip
          retention-days: 7
          if-no-files-found: error

  release:
    name: Draft release
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          expected=$(printf '%s\n' "RPGModder-$VERSION-linux-x64.tar.gz" "RPGModder-$VERSION-linux-x64.zip" "RPGModder-$VERSION-win-x64.zip" | sort)
          actual=$(ls -1 | sort)
          if [ "$actual" != "$expected" ]; then
            echo "::error::Unexpected release files:"
            echo "$actual"
            exit 1
          fi
          sha256sum RPGModder-* > SHA256SUMS
          cat SHA256SUMS

      - name: Write release notes
        run: |
          cat > notes.md <<'EOF'
          Draft notes: replace this line with the changes before publishing.

          ## Downloads

          - Windows: `RPGModder-VERSION-win-x64.zip`
          - Linux: `RPGModder-VERSION-linux-x64.tar.gz` (or the `.zip`)

          ## Windows SmartScreen

          RPGModder is not code signed, so Windows SmartScreen may warn the first time you run it.
          Choose "More info", then "Run anyway", after checking the download as below.

          ## Check your download

          `SHA256SUMS` lists the SHA-256 hash of every package.

          - Windows (PowerShell): `Get-FileHash .\RPGModder-VERSION-win-x64.zip -Algorithm SHA256`
          - Linux: `sha256sum -c --ignore-missing SHA256SUMS`

          The hash must equal the line for that file in `SHA256SUMS`. RPGModder's updater checks it on its own.
          EOF
          sed -i "s/VERSION/$VERSION/g" notes.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "RPGModder $VERSION" \
            --notes-file notes.md
